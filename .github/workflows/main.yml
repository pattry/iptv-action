name: 'Update schedule'

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=main" >> $GITHUB_ENV
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.BRANCH_NAME }}
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipenv
        run: pip3 install --user pipenv
      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy
      
      - name: 动态更新今日影视
        run: |
          curl -s "https://gh-proxy.org/https://raw.githubusercontent.com/fafa002/yf2025/refs/heads/main/yiyifafa.txt" > /tmp/today.txt
          sed -n '/今日影视,#genre#/,/#genre#/p' /tmp/today.txt | grep -v "^$" > config/local.txt

      - name: 为今日影视单独设置 urls_limit=1
        run: |
          cp config/config.ini config/config.ini.backup
          cp config/demo.txt config/demo.txt.backup
          sed -i 's/^urls_limit = .*/urls_limit = 1/' config/config.ini
          sed -n '/今日影视,#genre#/,/#genre#/p' /tmp/today.txt | grep -v "#genre#" | grep -v "^$" | cut -d',' -f1 > /tmp/today_channels.txt
          echo "今日影视,#genre#" > config/demo.tmp
          cat /tmp/today_channels.txt >> config/demo.tmp
          cp config/demo.tmp config/demo.txt
          pipenv run dev
          cp output/result.m3u output/result_today.m3u
          cp output/result.txt output/result_today.txt

      - name: 恢复配置，运行其他分类
        run: |
          cp config/config.ini.backup config/config.ini
          cp config/demo.txt.backup config/demo.txt
          sed -i '/gh-proxy.org/d' config/subscribe.txt
          pipenv run dev
          cp output/result.m3u output/result_other.m3u
          cp output/result.txt output/result_other.txt

      - name: 合并结果
        run: |
          # 提取今日影视分类
          sed -n '/^今日影视,#genre#/,/^[^ ]/p' output/result_today.txt | grep -v "^$" > /tmp/today_clean.txt
          sed -i '/^今日影视,#genre#/,/^[^ ]/d' output/result_other.txt
          cat output/result_other.txt /tmp/today_clean.txt > output/result_final.txt
          
          # 按分类分组去重
          awk '
            /^[^ ]/ && !/#genre#/ { category = $0 }
            /^    / { 
              key = category "|||" $0
              if (!seen[key]++) print
              next
            }
            { print }
          ' output/result_final.txt > output/result_final_dedup.txt
          mv output/result_final_dedup.txt output/result_final.txt
          cp output/result_final.txt output/result.txt
          
          # m3u格式
          sed -n '/^今日影视,#genre#/,/^[^ ]/p' output/result_today.m3u | grep -v "^$" > /tmp/today_clean.m3u
          sed -i '/^今日影视,#genre#/,/^[^ ]/d' output/result_other.m3u
          cat output/result_other.m3u /tmp/today_clean.m3u > output/result_final.m3u
          awk '
            /^[^ ]/ && !/#genre#/ { category = $0 }
            /^    / { 
              key = category "|||" $0
              if (!seen[key]++) print
              next
            }
            { print }
          ' output/result_final.m3u > output/result_final_dedup.m3u
          mv output/result_final_dedup.m3u output/result_final.m3u
          cp output/result_final.m3u output/result.m3u
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git reset -- .github/workflows/
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi
